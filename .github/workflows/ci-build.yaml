name: workflows CI

# Branch and pull-request CI. Pull requests are the per-branch gate, so `push`
# only covers the default branch: a branch with an open PR would otherwise run
# this whole pipeline twice for the same tree. Tags are the release workflow's
# job, and it calls its gate explicitly.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

# Superseded pull-request pushes stop early instead of finishing to fail.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      broker-postgres:
        image: postgres:17.4-alpine@sha256:7062a2109c4b51f3c792c7ea01e83ed12ef9a980886e3b3d380a7d2e5f6ce3f5
        env:
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker-ci-only
          POSTGRES_DB: broker
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U broker -d broker"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `ui/embed.go` embeds `dist/app`, which is gitignored, so a fresh
      # checkout has no bundle and the server packages would not compile. A
      # placeholder is enough: no Go test reads its contents, and the real
      # production bundle is built and exercised by the image and UI jobs.
      - name: Create the embedded UI placeholder
        run: mkdir -p ui/dist/app && printf '<!doctype html><title>placeholder</title>' > ui/dist/app/index.html
      - run: make test-hack
      # The per-release API contract check lives in the compatibility matrix
      # (a pull-request gate); do not repeat the tag fetches here.
      # One run over every package supersedes the focused list in
      # `make compatibility` (that target is what you run locally, and what the
      # docs point at; it is a subset of ./...).
      - name: Test every Go package
        env:
          KUBECONFIG: /dev/null
          GOFLAGS: -mod=mod -tags=kubernetes_protomessage_one_more_release
          BROKER_TEST_DATABASE_URL: "postgres://broker:broker-ci-only@\
            127.0.0.1:${{ job.services.broker-postgres.ports['5432'] }}/broker?\
            sslmode=disable"
        run: go test -p 2 ./...
      - name: Check the API fixtures exist
        env:
          GOFLAGS: -mod=mod
        run: go test -tags=api,kubernetes_protomessage_one_more_release ./test/e2e -run '^TestAPIFixturesExist$'

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Keep this version aligned with @playwright/test in ui/yarn.lock.
      image: mcr.microsoft.com/playwright:v1.64.0
      options: --init --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: yarn --cwd ui install --frozen-lockfile
      - name: Check CI coverage and artifact wiring
        run: node --test hack/tests/ci-workflows.test.js
      - run: yarn --cwd ui test --runInBand
      - run: yarn --cwd ui lint
      - name: Verify the Playwright container matches the test package
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const image = JSON.parse(
            fs.readFileSync('/ms-playwright/.docker-info', 'utf8')
          );
          const pkg = require(
            './ui/node_modules/@playwright/test/package.json'
          );
          assert.equal(pkg.version, image.driverVersion,
            'Update the Playwright CI image to match ui/yarn.lock');
          JS
      # Same command as make test-ui-e2e; the image does not include make.
      # playwright.mock.config.ts starts the dev server inside this container.
      - run: yarn --cwd ui playwright test -c playwright.mock.config.ts

  # Keep image producers and consumers in the same run: main's DinD checks
  # and runner conformance download the same runner artifact, never rebuild it.
  compatibility:
    uses: ./.github/workflows/compatibility.yaml
    with:
      scope: ${{ github.event_name == 'push' && 'full' || 'contract' }}
      runner-tests: true

  image:
    # `main` is covered by the compatibility matrix, which builds this image for
    # its cluster runs; the release builds and scans it again. Building here on
    # every push only duplicates that work.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: workflows:verify
          build-args: |
            VERSION=ci
            GIT_COMMIT=${{ github.sha }}
          # Reuse compatible layers across CI and releases. Final Go linking
          # still depends on the version metadata supplied by each workflow.
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - run: docker run --rm workflows:verify version
      # Dev and build dependencies never reach the image, and advisories
      # change without a code change: one nightly scan covers them.
      - name: Scan source and build dependencies
        if: github.event_name == 'schedule'
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs /src/node_modules --skip-dirs /src/ui/node_modules --skip-dirs /src/vendor /src
      - name: Scan runtime image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 workflows:verify
