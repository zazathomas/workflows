name: workflows compatibility matrix

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'contract only, or contract plus a disposable-cluster run for every registered release'
        type: choice
        default: full
        options:
          - full
          - contract
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      baseline: ${{ steps.read.outputs.baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read supported releases
        id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          registry = json.loads(pathlib.Path('hack/upstream-versions.json').read_text())
          matrix = [
              {
                  'tag': entry['tag'],
                  'commit': entry['commit'],
                  'sha256': entry['installManifestSha256'],
                  'chart': entry['helmChartVersion'],
              }
              for entry in registry['versions']
          ]
          print(f"baseline={registry['baseline']}")
          print('versions=' + json.dumps(matrix, separators=(',', ':')))
          PY

  # The contract check is the pull-request gate: it needs no image and no
  # cluster, so a schema break is caught in about a minute.
  contract:
    needs: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.registry.outputs.versions) }}
    name: contract ${{ matrix.version.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch ${{ matrix.version.tag }}
        run: git fetch --no-tags --depth=1 https://github.com/argoproj/argo-workflows.git "refs/tags/${{ matrix.version.tag }}:refs/tags/${{ matrix.version.tag }}"
      - name: Compare the API contract
        run: python3 hack/verify-upstream-contract.py --tag "${{ matrix.version.tag }}"

  # One image for every release, built once and handed to the cluster jobs.
  # Pull requests skip it (nothing would consume the artifact), and so does a
  # `scope: contract` dispatch.
  image:
    needs: registry
    if: github.event_name != 'pull_request' && inputs.scope != 'contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Capture build metadata
        id: meta
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      # Same cache scope as CI and the release: the Go and UI layers of this
      # image are compiled once per commit, not once per workflow.
      - name: Build the server image once for every release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: workflows:compatibility
          build-args: |
            VERSION=compatibility
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=compatibility
            GIT_TREE_STATE=clean
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - name: Build the runner image once for every release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          load: true
          tags: workflows-runner:compatibility
          build-args: |
            VERSION=compatibility
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=compatibility
            GIT_TREE_STATE=clean
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=runner-image
          cache-to: type=gha,mode=max,scope=runner-image
      - name: Build the standalone runner broker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.runner-broker
          platforms: linux/amd64
          load: true
          tags: workflows-runner-broker:compatibility
          cache-from: type=gha,scope=runner-broker-image
          cache-to: type=gha,mode=max,scope=runner-broker-image
      - name: Check the images run
        run: |
          docker run --rm workflows:compatibility version
          docker run --rm --entrypoint argo-runner workflows-runner:compatibility version
      - name: Export the images for the cluster jobs
        run: |
          docker save workflows:compatibility | gzip -1 > workflows-image.tar.gz
          docker save workflows-runner:compatibility | gzip -1 > workflows-runner-image.tar.gz
          docker save workflows-runner-broker:compatibility | gzip -1 > workflows-runner-broker-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-image
          path: workflows-image.tar.gz
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-runner-image
          path: workflows-runner-image.tar.gz
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-runner-broker-image
          path: workflows-runner-broker-image.tar.gz
          retention-days: 3
          if-no-files-found: error

  conformance:
    needs:
      - registry
      - image
    if: github.event_name != 'pull_request' && inputs.scope != 'contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.registry.outputs.versions) }}
    name: conformance ${{ matrix.version.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: workflows-image
      - name: Load the server image and install kind
        run: |
          docker load < workflows-image.tar.gz
          # The prebuilt binary: `go install sigs.k8s.io/kind` compiled kind from
          # source in every shard, which cost more than the cluster it drives.
          curl -fsSL -o "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run the conformance suite for ${{ matrix.version.tag }}
        run: bash hack/conformance-version.sh "${{ matrix.version.tag }}" workflows:compatibility

  runner-conformance:
    needs:
      - registry
      - image
    if: github.event_name != 'pull_request' && inputs.scope != 'contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.registry.outputs.versions) }}
    name: runner conformance ${{ matrix.version.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: workflows-runner-broker-image
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: workflows-runner-image
      - name: Load the images and install kind
        run: |
          docker load < workflows-runner-broker-image.tar.gz
          docker load < workflows-runner-image.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run the runner conformance suite for ${{ matrix.version.tag }}
        run: bash hack/conformance-runner-version.sh "${{ matrix.version.tag }}" workflows-runner-broker:compatibility workflows-runner:compatibility
