name: workflows compatibility matrix

# Branch and PR runs call this workflow from ci-build.yaml so image artifacts
# stay in one run. Weekly, manual, and release runs still work independently.
on:
  schedule:
    - cron: '45 3 * * 0'
  workflow_dispatch:
    inputs:
      scope:
        description: 'contract only, or contract plus clusters for all releases'
        type: choice
        default: full
        options:
          - full
          - contract
  workflow_call:
    inputs:
      scope:
        description: 'full enables clusters; contract skips them'
        type: string
        default: full
      runner-tests:
        description: 'Run DinD and executor tests using the shared runner image'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cluster_versions: ${{ steps.read.outputs.cluster_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read supported releases
        id: read
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 hack/compatibility-matrix.py \
            --event-name "$EVENT_NAME" --ref-type "$REF_TYPE" \
            >> "$GITHUB_OUTPUT"

  # One checkout and runner, but still every registered release and pinned SHA.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch every registered upstream release
        run: make upstream-versions
      - name: Compare every API contract
        run: make upstream-contract

  # Each image has its own producer, so unrelated builds cannot delay a suite.
  server-image:
    needs: registry
    if: github.event_name != 'pull_request' && inputs.scope != 'contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker/setup-buildx-action v3
      - uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Capture build metadata
        id: meta
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the server image
        # docker/build-push-action v6
        uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: workflows:compatibility
          build-args: |
            VERSION=compatibility
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=compatibility
            GIT_TREE_STATE=clean
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - run: docker run --rm workflows:compatibility version
      - name: Export the server image
        run: |
          docker save workflows:compatibility | gzip -1 > workflows-image.tar.gz
      # actions/upload-artifact v7.0.2
      - uses: >-
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflows-image
          path: workflows-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  runner-image:
    needs: registry
    if: >-
      inputs.runner-tests ||
      (github.event_name != 'pull_request' && inputs.scope != 'contract')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker/setup-buildx-action v3
      - uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Capture build metadata
        id: meta
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the shared runner image
        # docker/build-push-action v6
        uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          load: true
          tags: workflows-runner:compatibility
          build-args: |
            VERSION=compatibility
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=compatibility
            GIT_TREE_STATE=clean
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=runner-image
          cache-to: type=gha,mode=max,scope=runner-image
      - run: >-
          docker run --rm --entrypoint argo-runner
          workflows-runner:compatibility version
      - name: Export the shared runner image
        run: |
          docker save workflows-runner:compatibility |
            gzip -1 > workflows-runner-image.tar.gz
      # actions/upload-artifact v7.0.2
      - uses: >-
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflows-runner-image
          path: workflows-runner-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  broker-image:
    needs: registry
    if: github.event_name != 'pull_request' && inputs.scope != 'contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker/setup-buildx-action v3
      - uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the standalone runner broker image
        # docker/build-push-action v6
        uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.runner-broker
          platforms: linux/amd64
          load: true
          tags: workflows-runner-broker:compatibility
          cache-from: type=gha,scope=runner-broker-image
          cache-to: type=gha,mode=max,scope=runner-broker-image
      - name: Export the broker image
        run: |
          docker save workflows-runner-broker:compatibility |
            gzip -1 > workflows-runner-broker-image.tar.gz
      # actions/upload-artifact v7.0.2
      - uses: >-
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflows-runner-broker-image
          path: workflows-runner-broker-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  # These CI checks consume exactly the image used by runner conformance.
  # They do not wait for the server/broker builds or either cluster suite.
  runner:
    needs: runner-image
    if: inputs.runner-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actions/download-artifact v7.0.0
      - uses: >-
          actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: workflows-runner-image
      - name: Load the shared runner image
        run: docker load < workflows-runner-image.tar.gz
      - name: Start a limited job through the runner image entrypoint
        run: hack/test-runner-dind.sh workflows-runner:compatibility
      - name: Run executor integration tests against a throwaway Docker daemon
        run: |
          docker network create runner-integration
          docker run -d --name dind --network runner-integration --privileged \
            -e DOCKER_TLS_CERTDIR= docker:27-dind
          for _ in $(seq 1 60); do
            docker exec dind docker info > /dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network runner-integration \
            -v "$PWD":/src -w /src \
            -e RUNNER_DOCKER_INTEGRATION=1 -e DOCKER_HOST=tcp://dind:2375 \
            golang:1.27.3-alpine3.23 \
            sh -c 'go test -mod=mod \
              -tags=kubernetes_protomessage_one_more_release -count=1 \
              -timeout 300s -run TestIntegrationExecutor ./runner/ -v'

  # Branch pushes test oldest/newest patches; weekly/manual/release test all.
  conformance:
    needs:
      - registry
      - server-image
    if: github.event_name != 'pull_request' && inputs.scope != 'contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.registry.outputs.cluster_versions) }}
    name: conformance ${{ matrix.version.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actions/download-artifact v7.0.0
      - uses: >-
          actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: workflows-image
      - name: Load the server image and install kind
        run: |
          docker load < workflows-image.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/kind" \
            "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run the conformance suite for ${{ matrix.version.tag }}
        run: >-
          bash hack/conformance-version.sh "${{ matrix.version.tag }}"
          workflows:compatibility

  runner-conformance:
    needs:
      - registry
      - runner-image
      - broker-image
    if: github.event_name != 'pull_request' && inputs.scope != 'contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.registry.outputs.cluster_versions) }}
    name: runner conformance ${{ matrix.version.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actions/download-artifact v7.0.0
      - uses: >-
          actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: workflows-runner-broker-image
      - uses: >-
          actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: workflows-runner-image
      - name: Load the images and install kind
        run: |
          docker load < workflows-runner-broker-image.tar.gz
          docker load < workflows-runner-image.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/kind" \
            "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run the runner conformance suite for ${{ matrix.version.tag }}
        run: >-
          bash hack/conformance-runner-version.sh "${{ matrix.version.tag }}"
          workflows-runner-broker:compatibility workflows-runner:compatibility
