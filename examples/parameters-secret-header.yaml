# URL source with a Secret header.
#
# The server reads the header value from a Secret in the namespace receiving the
# run, so the caller needs get on that Secret. Secrets cannot be referenced across
# namespaces, and redirects to another host are refused once a header is attached.
#
# This example sends X-Example-Token to a public gist, which ignores the header:
# it shows the configuration without needing a real credential. Point it at your
# own endpoint and a real token in production.
apiVersion: v1
kind: Secret
metadata:
  name: parameter-source-token
  namespace: argo
type: Opaque
stringData:
  token: demo-token-not-a-real-credential
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: parameters-secret-header
  namespace: argo
  annotations:
    workflows.argoproj.io/description: |
      Fetch options with a header read from a Kubernetes Secret.
    workflows.argoproj.io/parameter-sources: |
      {
        "region": {
          "url": "https://gist.githubusercontent.com/zazathomas/cad6eaf36644a0aa36948b8fab8d1018/raw/options.json",
          "itemsPath": "regions",
          "labelPath": "label",
          "valuePath": "value",
          "secret": {"name": "parameter-source-token", "key": "token", "header": "X-Example-Token"}
        }
      }
spec:
  entrypoint: show
  serviceAccountName: wf-runner
  archiveLogs: false
  arguments:
    parameters:
      - name: region
        description: Options fetched with a token from a Secret.
  templates:
    - name: show
      inputs:
        parameters:
          - name: region
      container:
        image: docker.io/library/alpine:3.20
        command: [sh, -c]
        args:
          - echo "region={{inputs.parameters.region}}"
