# Demo for a supported upstream release, in the argo namespace.
# This only prints two fake requests. Opening the link does not authorize anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: run-action-demo
  labels:
    app.kubernetes.io/part-of: run-action-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-action-demo
  labels:
    app.kubernetes.io/part-of: run-action-demo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: run-action-demo
  labels:
    app.kubernetes.io/part-of: run-action-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: run-action-demo
subjects:
  - kind: ServiceAccount
    name: run-action-demo
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: run-action-demo
  labels:
    app.kubernetes.io/part-of: run-action-demo
  annotations:
    workflows-ui-action-marker: 'NEEDS_USER_ACTION:'
    workflows-ui-action-container: main
spec:
  serviceAccountName: run-action-demo
  entrypoint: demo
  templates:
    - name: demo
      container:
        image: busybox:1.36
        command: [sh, -c]
        args:
          - |
            printf '%s\n' 'NEEDS_USER_ACTION:{"kind":"open-url","id":"demo-1","title":"Demo request 1 of 2","url":"https://example.com/","code":"DEMO-ONE"}'
            sleep 60
            printf '%s\n' 'NEEDS_USER_ACTION:{"kind":"open-url","id":"demo-2","title":"Demo request 2 of 2","url":"https://example.com/","code":"DEMO-TWO"}'
            sleep 90
